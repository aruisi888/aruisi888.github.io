name: Generate ClashMeta Config

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时更新一次，可自行调整

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Docker
      uses: docker/setup-buildx-action@v2

    - name: Pull Subconverter Docker and Generate config
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/data \
          tideyg/subconverter \
          -gfwlist-url "https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt" \
          -url "https://sbgfw.trafficmanager.net/api/v1/client/subscribe?token=0d4d8503f2db341da4249e93c157b1cd,https://submit.xz61.cn:22443/api/v1/client/subscribe?token=678f81304784c5f188b444ba1f80b470,https://sub.xfltd.click/api/v1/client/subscribe?token=f33f3e910066bf389a9053c63c0fa6af,https://login.djjc.cfd/api/v1/client/subscribe?token=a3e20fd91ada5215c901b804af9284b4,https://times1747043924.caiyunsub.uk/api/v1/client/subscribe?token=f0b4ae93c5b0f17714597a1c4f0fba0c" \
          -target clash.meta \
          -config https://raw.githubusercontent.com/aruisi888/aruisi888.github.io/main/openclash.ini \
          -udp true \
          -append_type true \
          -emoji true \
          -scv true \
          -new_name clashmeta.yaml \
          -node_len 10000

    - name: Commit and Push
      run: |
        git config user.name github-actions[bot]
        git config user.email github-actions@github.com
        git add clashmeta.yaml
        git commit -m "更新合并后的 ClashMeta 订阅配置"
        git push
            - name: Commit and Push
        run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "github-actions[bot]"
        git add clashmeta.yaml || true
        git commit -m "更新 ClashMeta 订阅配置 $(date +'%F %T')" || echo "Nothing to commit"
        git push


